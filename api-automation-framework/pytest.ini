[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    smoke: core business checks used for fast build verification
    regression: complete API behavior regression scenarios
    auth: authentication and authorization scenarios
    user: user API scenarios
    product: product API scenarios
    order: order API scenarios
    e2e: complete cross-API business workflows
    db: database client checks or API-to-database assertions
